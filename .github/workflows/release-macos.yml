name: Release (macOS experimental)

# Builds an unsigned universal macOS app/dmg on GitHub's Apple Silicon
# runners. Experimental: no local Mac exists to test runtime, the app is
# unsigned (no Apple Developer ID), and the process spoofer is Windows-only.
#
# Run it manually from the Actions tab. The finished bundle is uploaded as a
# build artifact; attach it to the GitHub release afterwards.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned universal macOS app
    runs-on: macos-latest
    concurrency:
      group: release-macos
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust (Intel + Apple Silicon targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build and bundle (universal, unsigned)
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astral-macos-bundle
          path: src-tauri/target/universal-apple-darwin/release/bundle/**
          if-no-files-found: error
